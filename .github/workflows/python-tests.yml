name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python tests
        run: |
          python -m unittest discover -s reliable_agent_workflow/tests -v
          python -m unittest discover -s semantic_search/tests -v

      - name: Enforce retrieval quality floor
        run: python semantic_search/quality_gate.py

      - name: Compare hybrid retrieval against vector baseline
        run: python semantic_search/hybrid_quality_gate.py
